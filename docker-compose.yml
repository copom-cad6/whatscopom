version: '3.8'

services:
  zapchat:
    build: .
    container_name: zapchat_evolution
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://evolution.seudominio.com}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-atendimento}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://n8n.seudominio.com/webhook/whatsapp-evolution}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-whats-cad}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-AIzaSyAzOMSDXg3TRb9MRfKJxLp4mDk-Q5-zIdY}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-whats-cad.firebaseapp.com}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-whats-cad.firebasestorage.app}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID:-153886856889}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID:-1:153886856889:web:e2c95f4364cca561f96d68}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
    networks:
      - zapchat-network

networks:
  zapchat-network:
    driver: bridge
