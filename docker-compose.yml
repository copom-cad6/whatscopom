version: '3.8'

services:
  zapchat:
    build: .
    container_name: zapchat_evolution
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-https://evolution.seudominio.com}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME:-atendimento}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://n8n.seudominio.com/webhook/whatsapp-evolution}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
    networks:
      - zapchat-network

networks:
  zapchat-network:
    driver: bridge
